name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Run tests
        run: lake exe leanreach_tests
      - name: Test Lake project layouts
        shell: pwsh
        run: ./Tests/Layout/Test.ps1
