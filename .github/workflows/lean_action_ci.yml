name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Run semantic smoke tests
        run: lake exe leanreach_tests
      - name: Run CLI and NDJSON integration tests
        run: lake exe leanreach_integration_tests
