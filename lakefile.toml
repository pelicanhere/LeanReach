name = "LeanReach"
version = "4.32.0"
description = "Lean-native declaration search and dependency navigation"
keywords = ["devtool", "cli", "search"]
license = "Apache-2.0"
defaultTargets = ["LeanReach", "leanreach", "leanreach_tests"]
leanOptions.pp.unicode.fun = true
leanOptions.autoImplicit = false

[[require]]
name = "Regex"
git = "https://github.com/pandaman64/lean-regex.git"
rev = "v4.32.0"
subDir = "regex"

[[lean_lib]]
name = "LeanReach"

[[lean_lib]]
name = "Tests"

[[lean_exe]]
name = "leanreach"
root = "Main"
supportInterpreter = true

[[lean_exe]]
name = "leanreach_tests"
root = "Tests.Main"
supportInterpreter = true
